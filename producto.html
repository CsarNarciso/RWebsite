<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Regamsa Medical — Detalle de producto</title><link rel="stylesheet" href="styles.css"><script src="productos.js"></script><script src="app.js" defer></script></head>
<body><div class="topline"><span>INGENIERÍA PARA EL ENTORNO HOSPITALARIO</span></div>
<header><a href="index.html#inicio" aria-label="Regamsa Medical, inicio"><img class="logo" src="assets/Logo%20Empresa.png" alt="Regamsa Medical"></a><button class="menu" aria-expanded="false" aria-controls="nav">Menú <span>☰</span></button><nav id="nav"><a href="index.html#soluciones">Soluciones</a><a href="index.html#nosotros">Nosotros</a><a class="nav-cta" href="index.html#catalogo">Explorar catálogo <span>→</span></a></nav></header>
<main id="product-detail">
  <section class="device-section device-reverse" id="product-hero" aria-labelledby="pd-title">
    <div class="device-art">
      <img id="pd-hero-photo" src="" alt="">
    </div>
    <div class="device-copy">
      <p class="pd-section" id="pd-section"></p>
      <h1 class="pd-title" id="pd-title"></h1>
      <div class="device-actions pd-cta">
        <a class="device-btn device-btn-solid" href="index.html#contacto">Cotizar ahora →</a>
        <a class="device-btn device-btn-ghost pd-back-link" id="pd-back" href="#">← Volver a la línea</a>
      </div>
    </div>
  </section>
  <section class="pd-gallery">
    <div class="wrap">
      <div class="pd-media">
        <div class="pd-main-img"><img id="pd-main" src="" alt=""></div>
        <div class="pd-thumbs" id="pd-thumbs"></div>
      </div>
    </div>
  </section>
  <section class="pd-band">
    <div class="wrap pd-band-grid">
      <div class="pd-band-media"><img id="pd-band-img1" src="" alt=""></div>
      <div class="pd-band-copy">
        <p class="pd-band-eyebrow" id="pd-band-eyebrow1"></p>
        <h2 class="pd-band-title" id="pd-band-title1"></h2>
        <p class="pd-band-text" id="pd-band-text1"></p>
      </div>
    </div>
  </section>
  <section class="pd-band pd-band-reverse">
    <div class="wrap pd-band-grid">
      <div class="pd-band-media"><img id="pd-band-img2" src="" alt=""></div>
      <div class="pd-band-copy">
        <p class="pd-band-eyebrow" id="pd-band-eyebrow2"></p>
        <h2 class="pd-band-title" id="pd-band-title2"></h2>
        <div class="pd-chips" id="pd-chips"></div>
        <div class="pd-band-feats">
        <ul class="pd-band-feats-list" id="pd-features"></ul>
      </div>
      </div>
    </div>
  </section>
</main>
<footer><img class="logo" src="assets/Logo%20Empresa.png" alt="Regamsa Medical"><p>Equipamiento e infraestructura hospitalaria.</p></footer>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const p = (window.PRODUCTS||{})[id];
  if(!p){ document.getElementById('product-detail').innerHTML = '<div class="wrap"><p style="padding:60px 0">Producto no encontrado.</p><a class="btn-link" href="index.html">← Volver</a></div>'; return; }
  document.title = 'Regamsa Medical — ' + p.name;
  document.getElementById('pd-section').textContent = p.section;
  document.getElementById('pd-title').textContent = p.name;
  const be1 = document.getElementById('pd-band-eyebrow1'); if(be1) be1.textContent = p.section;
  const bt1 = document.getElementById('pd-band-title1'); if(bt1) bt1.textContent = p.lead;
  const bx1 = document.getElementById('pd-band-text1'); if(bx1) bx1.textContent = p.description;
  const be2 = document.getElementById('pd-band-eyebrow2'); if(be2) be2.textContent = 'Especificaciones';
  const bt2 = document.getElementById('pd-band-title2'); if(bt2) bt2.textContent = 'Detalles técnicos';
  const main = document.getElementById('pd-main');
  main.src = p.images[0];
  main.alt = p.name;
  const heroPhoto = document.getElementById('pd-hero-photo');
  if(heroPhoto){ heroPhoto.src = p.images[0]; heroPhoto.alt = p.name; }
  const b1 = document.getElementById('pd-band-img1'); if(b1 && p.images[0]){ b1.src = p.images[0]; b1.alt = p.name; }
  const b2 = document.getElementById('pd-band-img2'); if(b2 && p.images[1]){ b2.src = p.images[1]; b2.alt = p.name; } else if(b2 && p.images[0]){ b2.src = p.images[0]; b2.alt = p.name; }
  const thumbs = document.getElementById('pd-thumbs');
  p.images.forEach((src,i)=>{
    const b = document.createElement('button');
    b.type='button';
    b.className = 'pd-thumb' + (i===0?' is-active':'');
    b.innerHTML = '<img src="'+src+'" alt="">';
    b.addEventListener('click', ()=>{ main.src = src; thumbs.querySelectorAll('.pd-thumb').forEach(t=>t.classList.remove('is-active')); b.classList.add('is-active'); });
    thumbs.appendChild(b);
  });
  const chips = document.getElementById('pd-chips');
  p.specs.slice(0,3).forEach(s=>{ const c=document.createElement('span'); c.className='pd-chip'; c.textContent = s.label+': '+s.value; chips.appendChild(c); });
  const feats = document.getElementById('pd-features');
  p.features.forEach(f=>{ const li=document.createElement('li'); li.textContent = f; feats.appendChild(li); });
  const back = document.getElementById('pd-back');
  back.href = p.sectionUrl;
})();
</script>
</body></html>
